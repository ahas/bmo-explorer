# The web helper: one record's web reading — its page budget and search refusals, and its web session with the
# real browser a fetch falls back to — which the web's core tools and every site tool ask on its socket
# (docs/site-contract.md, 「The web helper's socket」).

[tool]
name = "web"
protocol = 1
language = "rust"
build = 'cargo build --release -p web-helper && cp "$BMO_CARGO_TARGET/release/web-helper" "$BMO_TOOL_OUT/"'
check = 'cargo test --test main web_helper::'
run = ["web-helper"]

[helper]
description = "One record's web reading: its page budget and search refusals, and its web session and real browser."
