# The web helper: one record's web reading — its research close, its web session with the standard Chrome a
# fetch falls back to, and its branches — which the web's core tools and every site tool ask on its socket
# (docs/site-contract.md, 「The web helper's socket」).

[tool]
name = "web"
protocol = 1
language = "rust"
build = 'cargo build --release -p web-helper && cp "$BMO_CARGO_TARGET/release/web-helper" "$BMO_TOOL_OUT/"'
check = 'cargo test --test web_helper'
run = ["web-helper"]
timeout = 30

[helper]
description = "One record's web reading: its research close, its web session and Chrome, and its branches."
