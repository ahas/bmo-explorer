# The browse launch (docs/browse-runs.md, 「The browse tool」): a browsing run handed to the unit command, whose
# ending a sync call waits for however long it takes. The repository's tools test holds the entry here to the
# tool answering it.

[tool]
name = "browse"
protocol = 1
language = "rust"
build = 'cargo build --release -p browse-tool && cp "$BMO_CARGO_TARGET/release/browse-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test --test tools'
run = ["browse-tool"]
timeout = 180

[[entry]]
namespace = "bmo"
name = "browse"
description = "Launch a browsing run that opens pages; what it saw comes back in this call (sync) or to your next turn (async)."
input = "browse.json"
hints = { open_world = true }
unbounded = true
capabilities = ["room.tools"]
grant = "search"
