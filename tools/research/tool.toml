# A research branch: one branch over an angle, opened and carried by the record's web helper through the session
# service the record names (docs/api.md, 「The research branch」). Its call waits as long as the branch runs,
# which the run's research close bounds. The repository's tools test holds the entry here to the tool answering it.

[tool]
name = "research"
protocol = 1
language = "rust"
build = 'cargo build --release -p research-tool && cp "$BMO_CARGO_TARGET/release/research-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test --test tools'
run = ["research-tool"]
timeout = 3600
shared = ["web"]

[[entry]]
namespace = "web"
name = "research"
title = "Research"
description = "Opens one research branch: a separate run that researches the angle you give it with the web tools and returns its notes when it has finished, which takes a minute or two. It takes a place in the common co-worker pool first and waits for one. The run's allowance and the pool decide, and a refusal is final for that request. Several branches may be opened in parallel with separate calls, and opening them together is how a turn's angles run side by side rather than one after another. What a branch returns is unchecked working notes."
input = "research.json"
hints = { read_only = true, open_world = true }
capabilities = ["web.branches"]

[entry.listing]
line = "- research — opens one research branch over an angle, a separate run with the web tools, and returns its working notes when it has finished; open several at once for a turn's angles"
order = 4
