# The forcing read: one page in the real browser with a CAPTCHA or browser challenge met on the way attempted
# once (docs/web-access.md, 「When the browser meets a challenge」). The repository's tools test holds the entry
# here to the tool answering it.

[tool]
name = "web_captcha"
protocol = 1
language = "rust"
build = 'cargo build --release -p web-captcha-tool && cp "$BMO_CARGO_TARGET/release/web-captcha-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test --test main tools::'
run = ["web-captcha-tool"]
shared = ["web"]

[[entry]]
namespace = "web"
name = "web_captcha"
title = "Web captcha"
description = "Reads one page on the forcing road: the real browser from the start, no direct attempt first, and a CAPTCHA or browser challenge met in the page worked as a bounded loop of rounds — the site's own check handed through to its end, then its box clicked, its slider pulled to its gap or its words typed, through the browser's own input on a walked human-like path, with the screen read by this deployment's own vision model where a round needs it read — until the challenge ends, the site ends it or the loop's bound of rounds and time is spent, and then the page opened once more. The answer is the page as web_fetch returns it, headed CHALLENGE CLEARED where a challenge stood and the retry came through, or NO CHALLENGE where the browser met none, with an ATTEMPT line saying what the loop came to: its rounds, what each acting round did and where it stopped. A challenge that stands is refused with its own words and that account, never with a claim of a solve, and nothing goes to a paid solving service."
input = "web_captcha.json"
hints = { read_only = true, open_world = true }
capabilities = ["web.read"]

[entry.listing]
line = "- web_captcha — one page read in the real browser with a CAPTCHA or challenge met on the way worked as a bounded loop of rounds and the page opened once more, the answer headed with what the loop came to"
order = 3
