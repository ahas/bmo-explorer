# How bmo-testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.
testbed = 0
name = "bmo-explorer"

[test]
# The Cargo workspace's crates, and the placed site tools held against an installed tool host, which runs where
# BMO_LIVE_TOOL_HOST names its mcp-host.
languages = ["cargo", "bun"]
files = ["tests/site-placed/**/*.test.ts"]
setup = ["cd tests/site-placed && bun install --frozen-lockfile"]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger is the Korean allowed per code file.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
korean_ledger = "korean-ledger.json"
# The base libraries this repository may build on. Every other unit is reached through the routes and commands
# docs/api.md states.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-markup"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[check.shared_versions.exceptions.reqwest]
reason = "The web helper reads pages the way a browser asks for them, gzip, brotli, deflate and zstd bodies decoded, which the shared line's features do not decode."
line = 'reqwest = { version = "0.13.5", features = ["brotli", "deflate", "gzip", "json", "query", "stream", "zstd"] }'

# No static step is declared for the workspace. The testbed's own Cargo workspace check formats and lints every
# member, every target compiled, through its Cargo verb in the shared build directory, wherever a change marks a
# crate, and the change check compiles every crate a change marks; a change that marks none has no Rust to judge.

# Each tool under tools/ is checked by its own manifest (docs/api.md, "The tools").
[tools]
dir = "tools"

# The unit command, which serves the MCP server, and each tool's executable go into a release's bin/.
[build]
binaries = [
  "bmo-explorer",
  "web-search-tool",
  "web-fetch-tool",
  "web-captcha-tool",
  "research-tool",
  "web-helper",
  "explorer-tool",
]

# The repository runs no service of its own: a deployment places its tools with the tool host and its unit
# command beside `bmo`. Its data stands in its own folder of the data root (docs/store.md).
[deploy]
root = "~/.local/share/bmo-explorer"
link = "deploy"
data_root = "~/.local/share/bmo/data"
units = []
# Answers 0 where no chat turn or research run stands under way that the restart would cut: the receiver's
# own `quiet` command, by its deployed path, waited on before the flip (the testbed's docs/deploy.md).
quiet = "~/.local/share/bmo-receiver/deploy/bin/bmo-receiver --config ~/.local/share/bmo-receiver/deploy/settings.toml quiet"

# The unit command, linked into the folder holding `bmo`, the first folder `bmo` looks for unit commands in.
# The link names this repository's deploy tree, whose own link stands across releases; a link made to the
# release being deployed would dangle once a later deployment prunes that release.
[[deploy.step]]
id = "link-unit-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
ln -sfn "$HOME/.local/share/bmo-explorer/deploy/bin/bmo-explorer" "$bmo_dir/bmo-explorer"
'''

# Each tool placed as one folder, its release executable beside its manifest and schemas, and registered with
# the tool host as this repository's own, allowing each capability and grant its entries ask for.
[[deploy.step]]
id = "register-web-helper"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/_shared/web/.placed
mkdir -p tools/_shared/web/.placed
cp bin/web-helper tools/_shared/web/tool.toml tools/_shared/web/.placed/
bmo pocket put tools/_shared/web/.placed --placed --service bmo-explorer
'''

[[deploy.step]]
id = "register-web-search"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/web_search/.placed
mkdir -p tools/web_search/.placed
cp bin/web-search-tool tools/web_search/tool.toml tools/web_search/*.json tools/web_search/.placed/
bmo pocket put tools/web_search/.placed --placed --service bmo-explorer --allow web.read
'''

[[deploy.step]]
id = "register-web-fetch"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/web_fetch/.placed
mkdir -p tools/web_fetch/.placed
cp bin/web-fetch-tool tools/web_fetch/tool.toml tools/web_fetch/*.json tools/web_fetch/.placed/
bmo pocket put tools/web_fetch/.placed --placed --service bmo-explorer --allow web.read
'''

[[deploy.step]]
id = "register-web-captcha"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/web_captcha/.placed
mkdir -p tools/web_captcha/.placed
cp bin/web-captcha-tool tools/web_captcha/tool.toml tools/web_captcha/*.json tools/web_captcha/.placed/
bmo pocket put tools/web_captcha/.placed --placed --service bmo-explorer --allow web.read
'''

[[deploy.step]]
id = "register-research"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/research/.placed
mkdir -p tools/research/.placed
cp bin/research-tool tools/research/tool.toml tools/research/*.json tools/research/.placed/
bmo pocket put tools/research/.placed --placed --service bmo-explorer --allow web.branches
'''

[[deploy.step]]
id = "register-explorer"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/explorer/.placed
mkdir -p tools/explorer/.placed
cp bin/explorer-tool tools/explorer/tool.toml tools/explorer/*.json tools/explorer/.placed/
bmo pocket put tools/explorer/.placed --placed --service bmo-explorer
'''
