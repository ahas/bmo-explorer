# This service's standing line in every agent's brain: when to reach for it. How its tools are called is
# their manuals', handed with a tool's first call in a session.
held_by = "explorer"

[[memory]]
key = "when"
type = "tip"
recall_condition = "facts from the web, or a page to read"
text = "Search with explorer_web_search, read the hits with explorer_web_fetch, and cite only pages read."
