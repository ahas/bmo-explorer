# The workspace and the repository's own package, `bmo-explorer`: the web reading, its client and MCP server, the
# site contract and the unit command, as modules of one crate under `src/`. Each tool the tool host
# places is a member of its own under `tools/`, since each is an executable the host starts by its manifest.
[workspace]
members = [
  "tools/_shared/web",
  "tools/explorer",
  "tools/research",
  "tools/web_fetch",
  "tools/web_search",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.5"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
avif-parse = "2.1.0"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
cookie = "0.18.1"
ego-tree = "0.10.0"
encoding_rs = "0.8.42"
futures-util = "0.3.34"
http = "1.3.1"
http-body-util = "0.1.3"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
libc = "0.2.177"
libsqlite3-sys = { version = "0.30.1", default-features = false }
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_span = "=0.153.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
rand = "0.9.2"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
regex = "1.11.1"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
reqwest = { version = "0.13.5", features = ["brotli", "deflate", "gzip", "json", "query", "stream", "zstd"] }
roxmltree = "0.21.1"
schemars = "1.0.4"
scraper = "0.25.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
serde_xmlrpc = "0.3.0-alpha.2"
simplecss = "0.2.2"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3.20.0"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-tungstenite = "0.29.0"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5.8"
yuv = "0.8.19"

[package]
name = "bmo-explorer"
description = "Web reading as an upstream: its client, its MCP server, the web tools a tool host places and the site contract."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's docs/conventions.md,
# 「Rust builds」).
autotests = false

[dependencies]
# An AVIF picture read into pixels: its container, its AV1 frames and their YUV turned into RGB.
avif-parse.workspace = true
rav1d.workspace = true
yuv.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
# The unit command's words.
clap.workspace = true
cookie.workspace = true
# A page's markup read as a tree, for what it is and the text a reader sees of it.
ego-tree.workspace = true
encoding_rs.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
# The proxy every Chrome the web layer starts sends everything through is an HTTP/1 server that takes CONNECT.
hyper.workspace = true
hyper-util.workspace = true
# A raster picture read and redrawn as JPEG to be looked at.
image.workspace = true
libc.workspace = true
# The store's busy handler, on the SQLite sqlx itself links, so a statement waits for another process's lock.
libsqlite3-sys.workspace = true
# A script's values read by the JavaScript parser.
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
# The MCP server a harness starts, on standard input and output.
rmcp.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
# A tool's input read as a JSON schema the host shows.
schemars.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
# A forum engine's XML-RPC answers.
serde_xmlrpc.workspace = true
# An element's inline style read for where it places a piece of text.
simplecss.workspace = true
# This repository's own store (docs/store.md).
sqlx.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# The settings built in beside the modules that read them.
toml.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
# A test's own folder and files, gone with it.
tempfile.workspace = true
# The README's folder table, read as markdown.
pulldown-cmark.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

# The build profiles bmo-chat's docs/conventions.md, 「Rust builds」, states, which the cargo-profile quick check
# holds: debug information down to line numbers in a development build, none in a test binary, whose panics still
# name their file and line, and no incremental state, since every checkout's crates build under names of their own
# in the one shared build directory.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
